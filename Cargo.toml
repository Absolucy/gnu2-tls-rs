[workspace]
members = [".", "macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
readme = "README.md"
homepage = "https://github.com/absolucy/gnu2-tls-rs"
repository = "https://github.com/absolucy/gnu2-tls-rs"

[workspace.lints.clippy]
complexity = "warn"
correctness = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
assigning_clones = "warn"
create_dir = "warn"
default_trait_access = "warn"
inefficient_to_string = "warn"
redundant_type_annotations = "warn"
self_named_module_files = "warn"
str_to_string = "warn"

[package]
name = "gnu2-tls"
description = "Thread locals that use GNU2 TLS descriptors instead of __tls_get_addr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
glibc-gnu2-tls-fix = []

[dependencies]
gnu2-tls-macros = { path = "macros", version = "0.1.0" }

[lints]
workspace = true

[[example]]
name = "fixture"
crate-type = ["cdylib"]

[profile.release]
debug = "full"
lto = "thin"
codegen-units = 1
overflow-checks = false
